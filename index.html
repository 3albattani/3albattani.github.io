<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Class of 3 Al-Battani Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Kiosk photobooth for iPad: black frame, 3 snaps, receipt print */
:root{--yel:#ffd23f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:500 17px/1.4 Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}
.title{font:700 clamp(46px,8vw,84px) 'Dancing Script',cursive;text-align:center;line-height:1.05;padding:4px 0 14px}
.mid{display:grid;place-items:center;min-height:0}
.view{position:relative;border-radius:20px;overflow:hidden;background:#141414}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.thumbs{display:flex;gap:12px;justify-content:center;padding:14px 0 6px}
.thumbs div{width:min(17vw,150px);aspect-ratio:4/3;border-radius:10px;border:2px dashed #555;background:#141414 center/cover;display:grid;place-items:center;color:#666;font-weight:700;font-size:26px}
.thumbs div.on{border:2px solid #fff;color:transparent}
.year{text-align:center;font:700 clamp(38px,6vw,68px)/1.1 'Dancing Script',cursive}
.ov{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;text-shadow:0 4px 22px rgba(0,0,0,.6)}
.ov .lab{font-size:clamp(24px,4vw,40px);font-weight:600}
.ov .num{font-size:clamp(120px,24vw,260px);font-weight:700;line-height:1}
.ov.ready .num{color:var(--yel)}
#look{position:absolute;font-weight:700;font-size:clamp(22px,3.4vw,34px);color:var(--yel);text-shadow:0 3px 14px rgba(0,0,0,.7);pointer-events:none;animation:nud 1s ease-in-out infinite alternate}
#look.top{top:16px;left:50%;transform:translateX(-50%)}#look.left{left:16px;top:50%}#look.right{right:16px;top:50%}
@keyframes nud{to{translate:0 -8px}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#idle{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25)}
#idle.err{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.75);overflow:auto}
#camErr{background:rgba(0,0,0,.8);border-radius:16px;padding:16px 18px;max-width:480px;font-size:17px}
#camErr button{margin-top:12px;font:700 18px Fredoka,sans-serif;min-height:52px;padding:0 22px;border-radius:999px;border:0;background:#fff;color:#111}
#startBtn{font:700 clamp(30px,5vw,48px) Fredoka,sans-serif;color:#111;background:var(--yel);border:0;border-radius:999px;padding:.55em 1.4em;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
#idleQr{position:absolute;right:14px;bottom:14px;background:#fff;color:#111;border-radius:14px;padding:8px;width:clamp(110px,15vw,150px);text-align:center;font-size:13px;font-weight:600;line-height:1.2}
#idleQr svg{width:100%;height:auto;display:block}
#msg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(0,0,0,.6);font-size:clamp(26px,4vw,40px);font-weight:600}
#gear{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#777;font-size:22px;z-index:5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:20px;z-index:8}
.card{background:#fff;color:#111;border-radius:26px;padding:24px;width:min(94vw,900px);max-height:94vh;overflow:auto;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px;align-items:center}
@media(max-width:700px),(orientation:portrait) and (max-width:900px){.card{grid-template-columns:minmax(0,1fr)}}
.card .rc{background:#eee;border-radius:14px;padding:12px;display:grid;place-items:center;max-height:70vh;overflow:auto}
.card .rc img{width:100%;max-width:260px;display:block;image-rendering:pixelated;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.card h2{font-size:clamp(30px,4vw,44px);margin:0 0 4px;line-height:1.05}
.card .qrbig{width:min(260px,60vw);margin:12px 0}
.card .qrbig svg{width:100%;height:auto;display:block}
.st{font-size:18px;color:#555;margin:0 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.b{font:700 20px Fredoka,sans-serif;min-height:58px;padding:0 26px;border-radius:999px;border:2px solid #ddd;background:#fff;color:#111;flex:1 1 180px}
.b.go{background:var(--yel);border-color:var(--yel)}
.set{background:#fff;color:#111;border-radius:22px;padding:22px;width:min(94vw,560px);max-height:92vh;overflow:auto;-webkit-user-select:text;user-select:text}
.set h2{margin:0 0 4px}.set p{margin:0 0 12px;color:#666;font-size:14px}
.set label{display:block;font-weight:600;margin:14px 0 6px}
.set input,.set select{width:100%;font:500 16px Fredoka,sans-serif;min-height:46px;padding:0 12px;border:2px solid #ddd;border-radius:12px;background:#fff;color:#111}
.set .b{min-height:48px;font-size:17px}
#bleSt{font-size:15px;margin:8px 0 0;color:#555}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){#startBtn,#look{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="title">3 Al-Battani</div>
  <div class="mid" id="mid">
    <div class="view" id="view">
      <video id="vid" playsinline muted autoplay></video>
      <div class="ov" id="ov"><div class="lab"></div><div class="num"></div></div>
      <div id="look" class="hide top">↑ Look at the camera ↑</div>
      <div id="flash"></div>
      <div id="msg" class="hide"></div>
      <div id="idle"><div style="display:grid;gap:16px;justify-items:center;text-align:center;padding:20px"><button id="startBtn">Tap to start</button><div id="camErr" class="hide"></div></div><div id="idleQr" class="hide"><div id="idleQrS"></div>All photos</div></div>
    </div>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="year">2026</div>
</div>
<button id="gear" aria-label="Settings (press and hold)">⚙</button>

<div class="modal hide" id="done"><div class="card">
  <div class="rc"><img id="rcImg" alt="Receipt preview"></div>
  <div>
    <h2>Here are your photos! 🎉</h2>
    <div class="qrbig" id="qrBig"></div>
    <p class="st" id="driveSt"></p><p class="st" id="doneSt"></p>
    <div class="btns"><button class="b go hide" id="printBtn">🖨 Print receipt</button><button class="b" id="againBtn">Done</button></div>
  </div>
</div></div>

<div class="modal hide" id="settings"><div class="set">
  <h2>Booth settings</h2>
  <p>Only for the person running the booth. Saved on this iPad. <b>App version 11</b> (no QR on receipt).</p>
  <label for="sScript">Google Apps Script URL</label><input id="sScript" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="sKey">Secret key (same as in the script)</label><input id="sKey">
  <div class="btns" style="margin-top:12px"><button class="b" id="pingBtn">Test Google Drive connection</button></div><p id="pingSt" style="margin:8px 0 0;font-size:15px"></p>
  <label for="sFolder">Google Drive folder link (for the “All photos” QR)</label><input id="sFolder" placeholder="https://drive.google.com/drive/folders/…">
  <label for="sMode">How to print</label>
  <select id="sMode"><option value="ble">Bluetooth printer (needs the Bluefy browser)</option><option value="share">Send to printer app (tap Print each time)</option><option value="none">Don't print</option></select>
  <label for="sWidth">Paper width</label>
  <select id="sWidth"><option value="label">4×6 inch label (FlashLabel / shipping label printer)</option><option value="384">58 mm receipt (384 dots)</option><option value="576">80 mm receipt (576 dots)</option></select>
  <label for="sCam">Where is the iPad camera?</label>
  <select id="sCam"><option value="top">Top of the screen</option><option value="left">Left side</option><option value="right">Right side</option></select>
  <div class="btns" style="margin-top:16px"><button class="b" id="bleBtn">Connect Bluetooth printer</button><button class="b" id="testBtn">Test print</button></div>
  <p id="bleSt">Printer not connected.</p>
  <div class="btns" style="margin-top:14px"><button class="b go" id="closeSet">Close</button></div>
</div></div>

<script>
{
const $=id=>document.getElementById(id);
const TITLE='3 Al-Battani',YEAR='2026',SHOTS=3,SNAP_SECS=3,DONE_SECS=60;
const DEF={script:'',key:'',folder:'',mode:'share',width:'label',cam:'top'};
let cfg=Object.assign({},DEF);try{Object.assign(cfg,JSON.parse(localStorage.getItem('albattani-booth')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('albattani-booth',JSON.stringify(cfg))}catch(e){}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let shots=[],busy=false,receipt=null,doneTimer=null,wake=null;

// ---------- camera ----------
let camErr='';
async function startCam(){
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error(location.protocol!=='https:'?'this page is not opened from an https:// link':'this browser has no camera access');
    if(!$('vid').srcObject){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1440}},audio:false});$('vid').srcObject=st}
    await $('vid').play();for(let i=0;i<30&&!$('vid').videoWidth;i++)await wait(100);camErr=$('vid').videoWidth?'':'the camera did not start'}
  catch(e){camErr=e.name==='NotAllowedError'?'camera permission was blocked':(e.message||String(e))}
  return !camErr;
}
function showCamErr(){$('camErr').innerHTML=`<b>The camera can't start</b> (${camErr}).<br>Open the booth from its https:// link in Safari and tap Allow for the camera.<br><button id="sampleBtn">Preview the strip with sample photos</button>`;
  $('camErr').classList.remove('hide');$('idle').classList.add('err');$('sampleBtn').onclick=samplePreview}
function sample(i){const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d'),cols=[['#ff9a8b','#ff6a88'],['#8ec5fc','#e0c3fc'],['#a8e063','#56ab2f']][i];
  const g=x.createLinearGradient(0,0,640,480);g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);x.fillStyle=g;x.fillRect(0,0,640,480);
  x.fillStyle='rgba(255,255,255,.9)';[[220,240],[420,240]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,95,0,7);x.fill()});
  x.fillStyle='#333';[[190,220],[250,220],[390,220],[450,220]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,12,0,7);x.fill()});
  x.lineWidth=8;x.strokeStyle='#333';x.lineCap='round';[[220,255],[420,255]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,40,.2,Math.PI-.2);x.stroke()});
  x.fillStyle='#fff';x.font='700 44px Fredoka, sans-serif';x.textAlign='center';x.fillText('Sample photo '+(i+1),320,430);return c}
async function samplePreview(){if(busy)return;busy=true;$('idle').classList.remove('err');$('camErr').classList.add('hide');$('idle').classList.add('hide');shots=[0,1,2].map(sample);thumbs();await finish()}
function fitView(){const r=$('mid').getBoundingClientRect(),w=Math.min(r.width,r.height*4/3);$('view').style.width=w+'px';$('view').style.height=w*3/4+'px'}
new ResizeObserver(fitView).observe($('mid'));
function grab(){const v=$('vid'),vw=v.videoWidth,vh=v.videoHeight,tw=Math.min(vw,vh*4/3),th=tw*3/4;
  const c=document.createElement('canvas');c.width=Math.round(tw);c.height=Math.round(th);const x=c.getContext('2d');
  x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,(vw-tw)/2,(vh-th)/2,tw,th,0,0,c.width,c.height);return c}
function showMsg(h){$('msg').innerHTML=h;$('msg').classList.toggle('hide',!h)}
function thumbs(){$('thumbs').innerHTML=Array.from({length:SHOTS},(_,i)=>shots[i]?`<div class="on" style="background-image:url(${shots[i].toDataURL('image/jpeg',.6)})"></div>`:`<div>${i+1}</div>`).join('')}

// ---------- session ----------
async function phase(label,secs,ready){const o=$('ov');o.classList.toggle('ready',!!ready);o.querySelector('.lab').textContent=label;
  for(let s=secs;s>0;s--){o.querySelector('.num').textContent=s;await wait(1000)}o.querySelector('.lab').textContent='';o.querySelector('.num').textContent=''}
function flash(){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
async function session(){
  if(busy||!$('vid').videoWidth)return;busy=true;shots=[];thumbs();$('idle').classList.add('hide');
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  $('look').className=cfg.cam;
  for(let i=0;i<SHOTS;i++){
    if(i>0)await wait(700);
    await phase(`Photo ${i+1} of ${SHOTS} — smile!`,SNAP_SECS);
    flash();shots[i]=grab();thumbs();
  }
  $('look').className='hide';
  await finish();
}
$('startBtn').onclick=async()=>{if(busy)return;$('camErr').classList.add('hide');$('idle').classList.remove('err');if(!$('vid').videoWidth){$('startBtn').textContent='Starting camera…';await startCam();$('startBtn').textContent='Tap to start'}if(!$('vid').videoWidth){showCamErr();return}session()};


// ---------- night-sky pattern (Al-Battani was an astronomer) ----------
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sparkle(x,cx,cy,r){x.beginPath();x.moveTo(cx,cy-r);x.quadraticCurveTo(cx,cy,cx+r,cy);x.quadraticCurveTo(cx,cy,cx,cy+r);x.quadraticCurveTo(cx,cy,cx-r,cy);x.quadraticCurveTo(cx,cy,cx,cy-r);x.fill()}
function crescent(x,cx,cy,r){x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(cx+r*.42,cy-r*.22,r*.86,0,7);x.fill();x.fillStyle='#fff'}
function planet(x,cx,cy,r,lw){x.lineWidth=lw;x.strokeStyle='#fff';x.save();x.translate(cx,cy);x.rotate(-.42);x.beginPath();x.ellipse(0,0,r*1.75,r*.48,0,0,7);x.stroke();x.restore();
  x.fillStyle='#000';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(cx-r*.3,cy-r*.3,r*.18,0,7);x.fill()}
function constel(x,pts,lw,dr){x.strokeStyle='#fff';x.lineWidth=lw;x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke();pts.forEach(([a,b])=>{x.beginPath();x.arc(a,b,dr,0,7);x.fill()})}
function deco(x,W,H,s,avoid,title,foot){
  const R=rng(11),ins=Math.round(8*s);x.fillStyle='#fff';x.strokeStyle='#fff';
  x.lineWidth=Math.max(1,2*s);x.setLineDash([3*s,6*s]);x.strokeRect(ins,ins,W-2*ins,H-2*ins);x.setLineDash([]);
  const free=(px,py,r)=>px-r>ins+2&&px+r<W-ins-2&&py-r>ins+2&&py+r<H-ins-2&&!avoid.some(([ax,ay,aw,ah])=>px+r>ax&&px-r<ax+aw&&py+r>ay&&py-r<ay+ah);
  let n=0;for(let t=0;t<4000&&n<Math.round(W*H/2600/s/s);t++){const px=R()*W,py=R()*H,big=R()<.22,r=(big?5+R()*5:1.2+R()*1.6)*s;
    if(!free(px,py,r+2*s))continue;n++;if(big)sparkle(x,px,py,r);else{x.beginPath();x.arc(px,py,r*.7,0,7);x.fill()}}
  const [tcy,tw]=title,side=(W-tw)/2,ic=Math.min(side*.26,28*s);
  if(ic>6*s){crescent(x,side/2+ins/2,tcy,ic);planet(x,W-side/2-ins/2,tcy,ic*.72,Math.max(1.5,2.2*s))}
  const [fy,fh,fw]=foot,lw=Math.max(1,1.4*s),dr=2.6*s,cx=W/2,half=fw/2+14*s,span=Math.min(W/2-half-ins-8*s,120*s);
  if(span>30*s){const m=fy+fh/2,L=cx-half,Rr=cx+half;
    constel(x,[[L-span,m-fh*.12],[L-span*.7,m+fh*.18],[L-span*.42,m-fh*.05],[L-span*.15,m+fh*.14]],lw,dr);
    constel(x,[[Rr+span*.15,m-fh*.16],[Rr+span*.45,m+fh*.1],[Rr+span*.72,m-fh*.12],[Rr+span,m+fh*.16]],lw,dr)}
}

// ---------- full-colour strip (saved to Drive) ----------
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fitFont(c,t,max,size){let f=size;c.font=`700 ${f}px Fredoka, sans-serif`;while(c.measureText(t).width>max&&f>14){f-=1;c.font=`700 ${f}px Fredoka, sans-serif`}return f}
// ---------- film-strip frame ----------
const SCRIPT=n=>`700 ${n}px "Dancing Script", cursive`;
function fitScript(c,t,max,size){let f=size;c.font=SCRIPT(f);while(c.measureText(t).width>max&&f>14){f-=1;c.font=SCRIPT(f)}return f}
function holes(x,X,Y,w,h,s){const hw=Math.round(15*s),hh=Math.round(20*s),step=Math.round(34*s),ox=Math.round(11*s),r=Math.max(2,3*s);x.fillStyle='#fff';
  for(let yy=Y+Math.round(10*s);yy+hh<=Y+h-Math.round(6*s);yy+=step){rr(x,X+ox,yy,hw,hh,r);x.fill();rr(x,X+w-ox-hw,yy,hw,hh,r);x.fill()}}
function bwPhoto(x,img,a,b,w,h){x.drawImage(img,a,b,w,h);const d=x.getImageData(a,b,w,h),p=d.data;
  for(let i=0;i<p.length;i+=4){let l=.299*p[i]+.587*p[i+1]+.114*p[i+2];l=(l-128)*1.12+128;p[i]=p[i+1]=p[i+2]=l}x.putImageData(d,a,b)}
function filmStrip(x,X,k,smooth){
  const sw=Math.round(384*k),side=Math.round(40*k),pw=sw-2*side,ph=Math.round(pw*.75),gap=Math.round(12*k),head=Math.round(118*k),foot=Math.round(92*k);
  const H=head+SHOTS*ph+(SHOTS-1)*gap+foot;
  x.fillStyle='#000';x.fillRect(X,0,sw,H);holes(x,X,0,sw,H,k);
  const rects=shots.map((_,i)=>[X+side,head+i*(ph+gap),pw,ph]);
  rects.forEach(([a,b,w,h],i)=>smooth?bwPhoto(x,shots[i],a,b,w,h):x.drawImage(shots[i],a,b,w,h));
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
  fitScript(x,TITLE,pw-Math.round(8*k),Math.round(66*k));x.fillText(TITLE,X+sw/2,head/2+4*k);
  fitScript(x,YEAR,pw,Math.round(56*k));x.fillText(YEAR,X+sw/2,H-foot/2+2*k);
  return {sw,H,rects};
}
const stripH=k=>{const pw=Math.round(384*k)-2*Math.round(40*k);return Math.round(118*k)+SHOTS*Math.round(pw*.75)+(SHOTS-1)*Math.round(12*k)+Math.round(92*k)};
function stripColor(){
  const k=2,sw=Math.round(384*k),W=sw*2,H=stripH(k),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  filmStrip(x,0,k,true);filmStrip(x,sw,k,false);return c;
}

// ---------- receipt (1-bit for thermal printer) ----------
function drawQr(x,link,X,Y,size){const q=qrcode(0,'M');q.addData(link);q.make();const n=q.getModuleCount(),m=size/(n+2);
  x.fillStyle='#fff';x.fillRect(X,Y,size,size);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(Math.floor(X+(k+1)*m),Math.floor(Y+(r+1)*m),Math.ceil(m),Math.ceil(m))}
function buildReceipt(link){
  const label=cfg.width==='label',W=label?768:+cfg.width,s=W/384,k=s/2,blackH=stripH(k),c=document.createElement('canvas');c.width=W;c.height=blackH+Math.round(560*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,c.height);
  const A=filmStrip(x,0,k,false),B=filmStrip(x,W/2,k,false),photos=[...A.rects,...B.rects];
  x.textAlign='center';x.textBaseline='middle';
  let y=blackH+Math.round(18*s);x.fillStyle='#000';
  x.font=`600 ${Math.round(18*s)}px Fredoka, sans-serif`;
  x.fillText(new Date().toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),W/2,y+Math.round(10*s));y+=Math.round(50*s);
  const H=y,out=document.createElement('canvas');out.width=W;out.height=H;out.getContext('2d').drawImage(c,0,0);
  const r=mono(out,photos);if(!label)return r;
  const LW=812,LH=1218,lc=document.createElement('canvas');lc.width=LW;lc.height=LH;const lx=lc.getContext('2d');lx.fillStyle='#fff';lx.fillRect(0,0,LW,LH);
  lx.drawImage(r.canvas,Math.round((LW-W)/2),Math.max(0,Math.round((LH-H)/2)));return {canvas:lc,bits:null,W:LW,H:LH};
}
function mono(c,photos){
  const W=c.width,H=c.height,x=c.getContext('2d'),im=x.getImageData(0,0,W,H),d=im.data,g=new Float32Array(W*H),bits=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  const inP=new Uint8Array(W*H);
  photos.forEach(([px,py,pw,ph])=>{for(let yy=py;yy<py+ph&&yy<H;yy++)for(let xx=px;xx<px+pw;xx++){const i=yy*W+xx;inP[i]=1;g[i]=Math.min(255,Math.max(0,(g[i]-128)*1.2+128+22))}});
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){const i=yy*W+xx;
    if(!inP[i]){bits[i]=g[i]<140?1:0;continue}
    const old=g[i],nw=old<128?0:255,e=old-nw;bits[i]=nw?0:1;
    if(xx+1<W&&inP[i+1])g[i+1]+=e*7/16;
    if(yy+1<H){if(xx>0&&inP[i+W-1])g[i+W-1]+=e*3/16;if(inP[i+W])g[i+W]+=e*5/16;if(xx+1<W&&inP[i+W+1])g[i+W+1]+=e/16}}
  for(let i=0;i<W*H;i++){const v=bits[i]?0:255;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255}
  x.putImageData(im,0,0);return {canvas:c,bits,W,H};
}
function escpos(r){if(!r.bits)throw new Error('Bluetooth printing only works with 58/80 mm receipt printers. Choose Send to printer app.');
  const bpr=r.W/8,parts=[Uint8Array.of(0x1B,0x40)];
  for(let y0=0;y0<r.H;y0+=96){const h=Math.min(96,r.H-y0),d=new Uint8Array(bpr*h);
    for(let y=0;y<h;y++)for(let x=0;x<r.W;x++)if(r.bits[(y0+y)*r.W+x])d[y*bpr+(x>>3)]|=0x80>>(x&7);
    parts.push(Uint8Array.of(0x1D,0x76,0x30,0,bpr&255,bpr>>8,h&255,h>>8),d)}
  parts.push(Uint8Array.of(0x1B,0x64,4));
  const out=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length});return out;
}

// ---------- Bluetooth printer ----------
const SVC=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb'];
let dev=null,chr=null;
const bleSt=t=>{$('bleSt').textContent=t};
async function gatt(){const srv=await dev.gatt.connect();for(const s of await srv.getPrimaryServices()){let cs=[];try{cs=await s.getCharacteristics()}catch(e){}
  for(const c of cs)if(c.properties.writeWithoutResponse||c.properties.write){chr=c;bleSt('Connected to '+(dev.name||'printer')+' ✓');return}}throw new Error('No printable channel found on this printer')}
$('bleBtn').onclick=async()=>{
  if(!navigator.bluetooth){bleSt('This browser has no Bluetooth. On iPad, open this page in the Bluefy browser.');return}
  try{dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SVC});
    dev.addEventListener('gattserverdisconnected',()=>{chr=null;bleSt('Printer disconnected — it will reconnect on the next print.')});
    bleSt('Connecting…');await gatt()}catch(e){bleSt('Could not connect: '+(e.message||e))}
};
async function sendBLE(bytes){
  if(!chr){if(!dev)throw new Error('Printer not connected — open settings and connect it');await gatt()}
  const fast=chr.properties.writeWithoutResponse,CH=fast?100:180;
  for(let i=0;i<bytes.length;i+=CH){const p=bytes.slice(i,i+CH);if(fast){await chr.writeValueWithoutResponse(p);await wait(10)}else await chr.writeValue(p)}
}
async function shareReceipt(){
  const b=await new Promise(r=>receipt.canvas.toBlob(r,'image/png')),f=new File([b],'receipt.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='receipt.png';a.click()}
}
async function print(){
  if(cfg.mode==='ble'){$('doneSt').textContent='Printing your receipt…';
    try{await sendBLE(escpos(receipt));$('doneSt').textContent='Take your receipt! Scan the QR to download your photo.'}
    catch(e){$('doneSt').textContent='Printing failed: '+(e.message||e);$('printBtn').classList.remove('hide')}}
  else if(cfg.mode==='share'){try{await shareReceipt()}catch(e){}}
}
$('testBtn').onclick=async()=>{
  const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,640,0);g.addColorStop(0,'#000');g.addColorStop(1,'#fff');x.fillStyle=g;x.fillRect(0,0,640,480);
  const keep=shots;shots=[c,c,c];receipt=buildReceipt(cfg.folder||'https://drive.google.com');shots=keep;
  if(cfg.mode==='share'){shareReceipt().catch(()=>{});return}
  try{bleSt('Printing test…');await sendBLE(escpos(receipt));bleSt('Test sent ✓')}catch(e){bleSt('Test failed: '+(e.message||e))}
};

// ---------- upload to Google Drive ----------
function jsonp(params){return new Promise((ok,no)=>{
  const cb='pb'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script');
  const clean=()=>{clearTimeout(t);try{delete window[cb]}catch(e){}sc.remove()};
  const t=setTimeout(()=>{clean();no(new Error('no answer from the script (check Who has access: Anyone)'))},15000);
  window[cb]=d=>{clean();ok(d)};sc.onerror=()=>{clean();no(new Error('the script link was refused (check Who has access: Anyone, and the /exec link)'))};
  sc.src=cfg.script+(cfg.script.includes('?')?'&':'?')+new URLSearchParams(Object.assign({},params,{callback:cb}));document.head.appendChild(sc)})}
async function upload(c){
  if(!cfg.script)return null;
  const name='al-battani-2026-'+new Date().toISOString().slice(5,19).replace(/[:T]/g,'-')+'-'+Math.floor(Math.random()*1e4)+'.jpg';
  const body=JSON.stringify({key:cfg.key,name,data:c.toDataURL('image/jpeg',.9).split(',')[1]});
  try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),30000);
    const r=await fetch(cfg.script,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,body});clearTimeout(t);
    const j=await r.json();if(!j.ok)throw new Error(j.error||'upload failed');return j.view}
  catch(e){if(e.name==='AbortError'||(e.message&&!/load failed|failed to fetch|networkerror|json/i.test(e.message)))throw e}
  // fallback for Safari: send without reading the reply, then ask the script for the link
  await fetch(cfg.script,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  let last='not found';
  for(let i=0;i<5;i++){await wait(2000);const j=await jsonp({find:name,key:cfg.key});if(j.ok&&j.view)return j.view;last=j.error||last;if(/key|Exception|Invalid/i.test(last))break}
  throw new Error(last);
}
$('pingBtn').onclick=async()=>{readSet();const el=$('pingSt');if(!cfg.script){el.textContent='❌ Paste the Google script link first.';return}
  el.textContent='Testing…';try{const j=await jsonp({ping:1,key:cfg.key});el.textContent=j.ok?'✅ '+j.message:'❌ '+j.error}catch(e){el.textContent='❌ '+e.message}};

// ---------- finish ----------
function qrSvg(el,link){if(!link||!window.qrcode){el.innerHTML='';return}const q=qrcode(0,'M');q.addData(link);q.make();el.innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true})}
async function finish(){
  showMsg('Saving your photos…');
  let link=null,err='';try{link=await upload(stripColor())}catch(e){err=e.name==='AbortError'?'timed out':(e.message||'error')}
  const qrLink=link||cfg.folder||'';
  receipt=buildReceipt(qrLink);showMsg('');
  $('rcImg').src=receipt.canvas.toDataURL('image/png');qrSvg($('qrBig'),qrLink);
  $('driveSt').textContent=link?'✅ Saved to Google Drive. Scan to download your photo.':(cfg.script?`❌ Not saved to Drive: ${err}`:'❌ Not saved to Drive: no Google script link in settings.');$('doneSt').textContent='';
  $('printBtn').classList.toggle('hide',cfg.mode!=='share');
  $('done').classList.remove('hide');
  clearTimeout(doneTimer);doneTimer=setTimeout(reset,DONE_SECS*1000);
  if(cfg.mode==='ble')print();
}
function reset(){clearTimeout(doneTimer);$('done').classList.add('hide');shots=[];thumbs();busy=false;$('idle').classList.remove('hide');try{wake&&wake.release()}catch(e){}}
$('againBtn').onclick=reset;
$('printBtn').onclick=()=>{$('printBtn').classList.toggle('hide',cfg.mode!=='share');print()};

// ---------- settings (press and hold the gear) ----------
let hold=null;
$('gear').addEventListener('pointerdown',()=>{hold=setTimeout(openSet,900)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('gear').addEventListener(ev,()=>clearTimeout(hold)));
function openSet(){$('sScript').value=cfg.script;$('sKey').value=cfg.key;$('sFolder').value=cfg.folder;$('sMode').value=cfg.mode;$('sWidth').value=String(cfg.width);$('sCam').value=cfg.cam;
  if(!navigator.bluetooth)bleSt('No Bluetooth in this browser. For Bluetooth printing on iPad, open this page in Bluefy.');$('settings').classList.remove('hide')}
function readSet(){cfg.script=$('sScript').value.trim();cfg.key=$('sKey').value.trim();cfg.folder=$('sFolder').value.trim();cfg.mode=$('sMode').value;cfg.width=$('sWidth').value==='label'?'label':+$('sWidth').value;cfg.cam=$('sCam').value;saveCfg();idleQr()}
['sScript','sKey','sFolder','sMode','sWidth','sCam'].forEach(id=>$(id).addEventListener('change',readSet));
$('closeSet').onclick=()=>{readSet();$('settings').classList.add('hide')};
function idleQr(){$('idleQr').classList.toggle('hide',!cfg.folder);qrSvg($('idleQrS'),cfg.folder)}

thumbs();idleQr();startCam();fitView();setTimeout(()=>{if(!$('vid').videoWidth&&camErr)showCamErr()},3500);
if(!cfg.script)setTimeout(()=>{if(!busy)openSet()},600);
}
